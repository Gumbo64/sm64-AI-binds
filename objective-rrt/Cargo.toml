[workspace]
resolver = "3"
members = ["core", "search", "objectives", "run"]
# pyenv/ (the sm64env Python extension) is parked: not a member, not committed.
default-members = ["core", "search", "objectives", "run"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
rand = "0.9.2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sm64-binds = "2.0.0"
lz4_flex = "0.14.0"
# Package names obrrt1-*: objective-rrt-v2 has the obrrt-* names, and a git dependency on this
# repo (sm64-crypto3's miner) picks a crate by package name. The keys keep v1's code unchanged.
obrrt-core = { path = "core", package = "obrrt1-core" }
obrrt-search = { path = "search", package = "obrrt1-search" }
obrrt-objectives = { path = "objectives", package = "obrrt1-objectives" }

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
