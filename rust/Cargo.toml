[package]
name = "sm64_ai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
byteorder = "1.5.0"
lz4_flex = "0.14.0"
papaya = "0.2.3"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.9.2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
sm64-binds = "2.0.0"
tqdm = "0.8.0"

[profile.release]
debug = true              # Include debug symbols
lto = "thin"             # Enable link-time optimization
codegen-units = 1        # Better optimization (slower compile)

# Separate profile for profiling (keeps release fast)
[profile.profiling]
inherits = "release"
debug = true             # Full debug info for symbols
strip = false           # Don't strip symbols

[[test]]
name = "bench_curiosity"
path = "tests/bench_curiosity.rs"
harness = false

# Utilities for looking at replays and saved runs (`cargo run --release --bin <name>`).
[[bin]]
name = "replay_info"
path = "tools/replay_info.rs"

[[bin]]
name = "level_timeline"
path = "tools/level_timeline.rs"

[[bin]]
name = "noise_bench"
path = "tools/noise_bench.rs"

[[bin]]
name = "curiosity_data"
path = "tools/curiosity_data.rs"
