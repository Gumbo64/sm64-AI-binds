[package]
name = "objective-scattershot-v1"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
lz4_flex = "0.14.0"
obrrt-core = { path = "../objective-rrt/core", package = "obrrt1-core" }
rand = "0.9.2"
rand_distr = "0.5"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sm64-binds = "2.0.0"
sm64_ai = { path = "../rust" }

[profile.release]
debug = true              # Include debug symbols
lto = "thin"             # Enable link-time optimization
codegen-units = 1        # Better optimization (slower compile)

[workspace]
