[package]
name = "obrrt-search"
description = "Objective-based RRT's search: state tree, objective pool, sampling, GA attempts, diagnostics and automatic tuning."
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sm64-binds.workspace = true
lz4_flex.workspace = true
obrrt-core.workspace = true
obrrt-objectives.workspace = true
# OBRRT_REROUTE_SCHEMA: an objective-scattershot schema's key as "the same state".
# Vendored copy (scattershot/) built against v2 core.
objective-scattershot = { path = "../scattershot" }

[features]
# Worker games are game::HookedGame: every frame goes through a downstream
# crate's StepHook (sm64-crypto3's miner plugs in the SM64Coin perturbation).
hooked = []

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { workspace = true, features = ["wasm_js"] }
