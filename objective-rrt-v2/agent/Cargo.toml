[package]
name = "obrrt-agent"
description = "Agent-driven routes: a sliding window of objectives solved by a persistent rolling-horizon GA, with full history (inputs, objectives, GA populations), sparse checkpoints, rewinds and state analysis tools (`ar`)."
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sm64-binds.workspace = true
lz4_flex.workspace = true
obrrt-core.workspace = true
obrrt-search.workspace = true
obrrt-objectives.workspace = true
obrrt-spec.workspace = true

[[bin]]
name = "ar"
path = "src/main.rs"

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { workspace = true, features = ["wasm_js"] }
