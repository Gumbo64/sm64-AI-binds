[package]
name = "obrrt-core"
description = "The contract between Objective-based RRT's search and its objectives: game snapshots and the Objective trait."
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["rc"] }
sm64-binds.workspace = true

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { workspace = true, features = ["wasm_js"] }
web-time = "1"
wasm-bindgen = "0.2"
