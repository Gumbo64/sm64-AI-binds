[package]
name = "objective-scattershot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
lz4_flex = "0.14.0"
obrrt-core = { path = "../core" }
rand = "0.9.2"
rand_distr = "0.5"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sm64-binds = { version = "2.0.0", default-features = false }

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { version = "2.0.0", features = ["default"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { version = "2.0.0", default-features = false, features = ["wasm_js"] }
